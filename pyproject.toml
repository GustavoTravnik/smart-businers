[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbusiners"
version = "1.0.0"
description = "SmartBusiners AI Engine - Commercial AI CLI & Web Dashboard powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Commercial"}
authors = [
    {name = "SmartBusiners Team"}
]
keywords = ["ai", "cli", "gemini", "antigravity", "agent", "dashboard", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "google-genai>=0.1.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1"
]

[project.scripts]
smartbusiners = "smartbusiners.cli:app"
smartbusiners-gui = "smartbusiners.gui.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartbusiners*"]
